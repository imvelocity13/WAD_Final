<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exam Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sidebar {
      width: 250px;
      background: #343a40;
      color: #fff;
      transition: transform 0.3s ease;
    }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 10px 15px;
      display: block;
    }

    .sidebar a:hover {
      background: #495057;
    }

    .content {
      flex: 1;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        transform: translateX(-100%);
        z-index: 1000;
      }

      .sidebar.show {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <nav class="sidebar p-3" id="sidebar">
    <h5 class="mb-3">Admin Dashboard</h5>
    <a href="#" data-section="dashboard">Dashboard</a>
    <a href="#" data-section="exams">Exams</a>
    <a href="#" data-section="students">Students</a>
    <a href="#" data-section="results">Results</a>
    <a href="#" data-section="settings">Settings</a>
  </nav>

  <!-- Main Content -->
  <div class="content">
    <button class="btn btn-outline-secondary d-md-none mb-3" id="toggleBtn" data-bs-toggle="tooltip" title="Toggle Menu">☰ Menu</button>
    <div id="mainContent"></div>
  </div>

  <!-- Student Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="studentModalLabel">Student Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Student name: John Doe<br />
          ID: STU12345<br />
          Exams Registered: 5
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const sidebar = document.getElementById('sidebar');
    const content = document.getElementById('mainContent');

    const sections = {
      dashboard: `
        <h2>Welcome, Admin</h2>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="card text-bg-primary" data-bs-toggle="tooltip" title="Number of active exams">
              <div class="card-body">
                <h5>Total Exams</h5>
                <p class="display-6">15</p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-bg-success" data-bs-toggle="tooltip" title="Students registered in system">
              <div class="card-body">
                <h5>Registered Students</h5>
                <p class="display-6">230 <span class="badge bg-light text-dark">+10 new</span></p>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-bg-warning" data-bs-toggle="tooltip" title="Results yet to be uploaded">
              <div class="card-body">
                <h5>Pending Results</h5>
                <p class="display-6">8 <span class="badge bg-danger">Urgent</span></p>
              </div>
            </div>
          </div>
        </div>
        <div class="mt-4">
          <h4>Recent Activity</h4>
          <div class="row">
            <div class="col-md-6">
              <div class="card">
                <div class="card-body">
                  <h5>System Status</h5>
                  <p class="text-success">All systems operational.</p>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card">
                <div class="card-body">
                  <h5>Latest Update</h5>
                  <p>Student records updated 2 hours ago.</p>
                </div>
              </div>
            </div>
          </div>
        </div>`,
      exams: `
        <h2>Exams</h2>
        <p>List of all scheduled exams will appear here.</p>`,
      students: `
        <h2>Students</h2>
        <p>Manage student records and enrollments here.</p>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal" data-bs-toggle="tooltip" title="Click to view a sample student">View Sample Student</button>`,
      results: `
        <h2>Results</h2>
        <p>Upload and view exam results.</p>`,
      settings: `
        <h2>Settings</h2>
        <p>Configure dashboard preferences and admin settings.</p>`
    };

    document.querySelectorAll('.sidebar a').forEach(link =>
      link.addEventListener('click', e => {
        e.preventDefault();
        content.innerHTML = sections[link.dataset.section];
        sidebar.classList.remove('show');
        initializeTooltips();
      })
    );

    toggleBtn.addEventListener('click', () => sidebar.classList.toggle('show'));

    function initializeTooltips() {
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map(el => new bootstrap.Tooltip(el));
    }

    // Load default section and enable tooltips
    content.innerHTML = sections.dashboard;
    initializeTooltips();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
