<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="#">College Admin</a>
    <div class="ms-auto">
      <span class="badge bg-warning text-dark">3 New Alerts</span>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container-fluid mt-4">
    <div class="row g-4">
      <!-- Sidebar -->
      <div class="col-md-3">
        <div class="list-group">
          <a href="#" class="list-group-item list-group-item-action active">Dashboard</a>
          <a href="#" class="list-group-item list-group-item-action">Students</a>
          <a href="#" class="list-group-item list-group-item-action">Faculty</a>
          <a href="#" class="list-group-item list-group-item-action">Courses</a>
        </div>
      </div>

      <!-- Dashboard Cards -->
      <div class="col-md-9">
        <div class="row g-3">
          <!-- Card 1 -->
          <div class="col-md-4">
            <div class="card text-white bg-success">
              <div class="card-body">
                <h5 class="card-title">Total Students</h5>
                <p class="card-text">1,250</p>
              </div>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="col-md-4">
            <div class="card text-white bg-info">
              <div class="card-body">
                <h5 class="card-title">Active Faculty</h5>
                <p class="card-text">120</p>
              </div>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="col-md-4">
            <div class="card text-white bg-danger">
              <div class="card-body">
                <h5 class="card-title">Pending Requests</h5>
                <p class="card-text">14</p>
              </div>
            </div>
          </div>

          <!-- Announcements -->
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">Recent Announcements</div>
              <div class="card-body">
                <ul class="list-group">
                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    Exam Timetable Released
                    <span class="badge bg-primary">New</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    Campus Closed on Friday
                    <span class="badge bg-secondary">Info</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    New Course Added
                    <span class="badge bg-success">Updated</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
